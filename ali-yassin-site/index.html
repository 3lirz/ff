<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>علي ياسين | معرض الأعمال</title>
<meta name="description" content="الموقع الشخصي لعلي ياسين — معرض تطبيقات ومواقع وأنظمة رقمية بتأثيرات ثلاثية الأبعاد.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: one full-screen stage, five pages that swap with a blur dissolve.
   A floating glass nav on top; deep violet ground with faint ripple rings. */
:root{
  --bg:#0b0820;
  --bg-2:#160f36;
  --ink:#f5f2ff;
  --muted:#b3a9dc;
  --accent:#8b5cf6;
  --accent-deep:#6d28d9;
  --accent-soft:#b9a2ff;
  --glass:rgba(255,255,255,.055);
  --glass-line:rgba(190,170,255,.2);
  --display:'Cairo','Segoe UI',Tahoma,sans-serif;
  --body:'Tajawal','Segoe UI',Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  background:var(--bg);color:var(--ink);
  font-family:var(--body);font-size:16px;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent-soft);outline-offset:3px;border-radius:12px}

.app{position:relative;height:100%;direction:rtl;isolation:isolate}

/* ---------- background ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:
    radial-gradient(900px 420px at 50% -8%,rgba(124,58,237,.42),transparent 70%),
    radial-gradient(700px 500px at 12% 110%,rgba(91,33,182,.28),transparent 70%),
    linear-gradient(180deg,var(--bg-2),var(--bg) 60%);}
#ripples{position:absolute;inset:0;width:100%;height:100%;animation:drift 40s ease-in-out infinite alternate}
@keyframes drift{to{transform:scale(1.06) translate(-1.5%,1%)}}

/* ---------- top bar ---------- */
.top{position:absolute;inset:max(14px,env(safe-area-inset-top,0px)) 0 auto;z-index:20;
  display:flex;justify-content:center;align-items:center;gap:12px;pointer-events:none}
.top>*{pointer-events:auto}
.brand,.pill,.burger{
  background:var(--glass);border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  box-shadow:0 10px 40px rgba(8,4,30,.45)}
.brand{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px 0 18px;border-radius:99px;
  font-family:var(--display);font-weight:800;font-size:.95rem}
.mini{width:28px;height:28px;border-radius:50%;overflow:hidden;background:#3a2a80;display:grid;place-items:end center;flex:none}
.mini img,.mini svg{width:100%;height:100%;object-fit:cover;display:block}
.pill{position:relative;display:flex;gap:2px;padding:5px;border-radius:99px}
.pill button{position:relative;z-index:1;height:36px;padding:0 17px;border-radius:99px;
  font-weight:700;font-size:.9rem;color:var(--muted);transition:color .3s;white-space:nowrap}
.pill button.on{color:#fff}
.thumb{position:absolute;z-index:0;top:5px;bottom:5px;border-radius:99px;
  background:linear-gradient(135deg,#9d74ff,var(--accent-deep));
  box-shadow:0 0 26px rgba(139,92,246,.6),inset 0 1px 0 rgba(255,255,255,.35);
  transition:left .5s cubic-bezier(.2,.9,.2,1),width .5s cubic-bezier(.2,.9,.2,1)}
.burger{position:absolute;left:0;top:0;width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
.burger svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}

/* ---------- pages ---------- */
.pages{position:absolute;inset:0}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  padding:calc(88px + env(safe-area-inset-top,0px)) 0 40px;display:flex;
  opacity:0;filter:blur(16px);transform:perspective(1500px) translate3d(14%,0,-350px) rotateY(-48deg) rotateX(7deg) scale(.88);transform-origin:center center;backface-visibility:hidden;pointer-events:none;visibility:hidden;
  transition:opacity .65s ease,filter .65s ease,transform .9s cubic-bezier(.15,.88,.22,1),visibility 0s .9s}
.page.on{opacity:1;filter:none;transform:perspective(1500px) translate3d(0,0,0) rotateY(0) rotateX(0) scale(1);pointer-events:auto;visibility:visible;
  transition:opacity .7s ease .1s,filter .7s ease .1s,transform .9s cubic-bezier(.15,.88,.22,1) .1s}
.page>.inner{margin:auto;width:100%}

.sec-title{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.sec-title h2{margin:0;display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:900;font-size:clamp(1.6rem,3.4vw,2.4rem);line-height:1.2}
.sec-title h2::before{content:"";width:5px;height:1.05em;border-radius:3px;background:linear-gradient(var(--accent-soft),var(--accent-deep))}
.sec-title p{margin:0;color:var(--muted);font-size:1rem;padding-inline-start:15px}

/* ---------- home ---------- */
.hero{--hfs:clamp(2.9rem,min(11vw,17vh),8.6rem);display:flex;flex-direction:column;align-items:center;text-align:center}
.hero h1{margin:0;font-family:var(--display);font-weight:900;line-height:1.02;
  font-size:var(--hfs);letter-spacing:-.01em}
.hero h1>span{display:block}
.hero .l2{color:var(--accent-soft);background:linear-gradient(180deg,#c7b4ff,#8b5cf6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero .l2 i{font-style:normal}
.hero-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;width:min(760px,100%);margin-top:calc(var(--hfs) * -.42);position:relative}
.avatar{width:min(34vh,300px);aspect-ratio:1/1.05;display:grid;place-items:center;filter:drop-shadow(0 22px 40px rgba(124,58,237,.45))}
.avatar img,.avatar svg{width:100%;height:100%;object-fit:contain}
.who{justify-self:start;display:flex;flex-direction:column;align-items:flex-start;padding-bottom:18%}
.who b{font-family:var(--display);font-weight:800;font-size:clamp(1.05rem,2vw,1.4rem)}
.who span{color:var(--accent-soft);font-size:.95rem}
.cta{justify-self:end;margin-bottom:18%;display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 22px;border-radius:99px;
  font-weight:700;background:linear-gradient(135deg,#9d74ff,var(--accent-deep));
  box-shadow:0 12px 30px rgba(124,58,237,.5),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .3s,box-shadow .3s}
.cta:hover{transform:translateY(-3px);box-shadow:0 18px 38px rgba(124,58,237,.65),inset 0 1px 0 rgba(255,255,255,.35)}
.cta svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.page.on .l1{animation:rise .9s cubic-bezier(.2,.8,.2,1) .15s both}
.page.on .l2{animation:rise .9s cubic-bezier(.2,.8,.2,1) .3s both}
.page.on .avatar{animation:pop 1s cubic-bezier(.2,.9,.2,1) .5s both}
.page.on .who,.page.on .cta{animation:rise .8s ease .85s both}
@keyframes rise{from{opacity:0;transform:translateY(30px);filter:blur(10px)}}
@keyframes pop{from{opacity:0;transform:translateY(60px) scale(.86)}}

/* ---------- works ---------- */
#works .inner{height:100%;display:flex;flex-direction:column;gap:clamp(10px,2vh,24px)}
.works-wrap{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0;
  transition:opacity .45s ease,filter .45s ease,transform .45s ease}
.works-wrap.swap{opacity:0;filter:blur(14px);transform:scale(.95)}
.w-head{width:min(1100px,100%);margin-inline:auto;padding-inline:clamp(0px,4vw,40px)}
.stage3d{position:relative;flex:1;min-height:300px;--ch:min(58vh,540px);--cw:calc(var(--ch)/1.42);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);touch-action:pan-y}
.stage3d.float{perspective:1500px}
.card{position:absolute;left:50%;top:50%;width:var(--cw);height:var(--ch);border-radius:22px;
  transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .6s ease,filter .6s ease;will-change:transform}
.float .card{width:calc(var(--ch)*1.12);height:calc(var(--ch)*.8);border-radius:10px}
.poster{position:relative;width:100%;height:100%;border-radius:inherit;overflow:hidden;
  background:linear-gradient(160deg,var(--c1),var(--c2));
  box-shadow:0 26px 60px rgba(4,2,20,.6),inset 0 0 0 1px rgba(255,255,255,.12);
  display:flex;flex-direction:column;justify-content:space-between;padding:clamp(14px,2vw,24px);text-align:start}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster .tag{align-self:flex-start;font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.2)}
.poster .ring{position:absolute;inset-inline:18%;top:24%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),rgba(255,255,255,.08) 60%);
  box-shadow:0 0 0 14px rgba(255,255,255,.08),0 0 0 32px rgba(255,255,255,.05)}
.poster h3{position:relative;margin:0;font-family:var(--display);font-weight:900;font-size:clamp(1.1rem,2.2vw,1.7rem);line-height:1.25;text-shadow:0 2px 14px rgba(0,0,0,.3)}
.poster small{position:relative;display:block;margin-top:4px;opacity:.85;font-size:.85rem}
.book{position:relative;width:100%;height:100%;display:flex;filter:drop-shadow(0 28px 34px rgba(0,0,0,.55))}
.book>img{width:100%;height:100%;object-fit:contain}
.pg{flex:1;position:relative;background:#f3efe6;padding:12%;display:flex;flex-direction:column;gap:7%}
.pg.l{border-radius:8px 0 0 8px;background:linear-gradient(90deg,#e7e1d3,#f6f2e9 40%)}
.pg.r{border-radius:0 8px 8px 0;background:linear-gradient(270deg,#e7e1d3,#f6f2e9 40%)}
.pg i{display:block;height:6px;border-radius:3px;background:#c9c2b2}
.pg i:nth-child(2n){width:80%}
.pg .blk{flex:1;border-radius:8px;background:linear-gradient(150deg,var(--c1),var(--c2))}
.badges{position:absolute;inset:0;pointer-events:none;transition:opacity .5s}
.badge{position:absolute;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(135deg,#a98bff,#6d28d9);box-shadow:0 10px 24px rgba(109,40,217,.6),inset 0 1px 0 rgba(255,255,255,.4);
  animation:bob 3.4s ease-in-out infinite}
.badge::after{content:"";position:absolute;bottom:-5px;left:12px;width:12px;height:12px;background:#6d28d9;transform:rotate(45deg);border-radius:0 0 3px 0}
.badge svg{position:relative;z-index:1;width:20px;height:20px;fill:#fff;stroke:#fff;stroke-width:1.4}
@keyframes bob{50%{transform:translateY(-12px) rotate(4deg)}}
.dots{display:flex;justify-content:center;gap:7px;padding-bottom:6px}
.dots i{width:6px;height:6px;border-radius:99px;background:rgba(190,170,255,.3);transition:width .4s,background .4s}
.dots i.on{width:26px;background:var(--accent)}

/* ---------- about ---------- */
.about{width:min(900px,100%);margin-inline:auto;display:grid;grid-template-columns:minmax(200px,300px) 1fr;gap:clamp(22px,4vw,48px);align-items:center}
.photo{position:relative;aspect-ratio:4/5;border-radius:24px;overflow:hidden;border:1px solid var(--glass-line);
  background:radial-gradient(circle at 50% 38%,#8b5cf6 0,#4c2aa8 42%,#1c1245 100%);
  box-shadow:0 30px 70px rgba(8,4,30,.6);display:grid;place-items:end center}
.photo img,.photo svg{width:100%;height:100%;object-fit:cover;display:block}
.photo::before{content:"";position:absolute;inset:0;
  background:repeating-radial-gradient(circle at 50% 40%,transparent 0 22px,rgba(255,255,255,.05) 22px 23px);opacity:.8}
.photo>*{position:relative}
.about-txt small{color:var(--accent-soft);font-weight:700;font-size:1rem}
.about-txt h2{margin:2px 0 0;font-family:var(--display);font-weight:900;font-size:clamp(2.2rem,5vw,3.6rem);line-height:1.15}
.about-txt hr{width:64px;height:3px;border:0;border-radius:3px;background:var(--accent);margin:14px 0 20px}
.about-txt p{margin:0 0 14px;font-size:clamp(.98rem,1.5vw,1.1rem);line-height:2;font-weight:500;color:#e3ddff;text-align:justify}
.page.on .photo{animation:rise .9s cubic-bezier(.2,.8,.2,1) .2s both}
.page.on .about-txt>*{animation:rise .8s ease both}
.page.on .about-txt>*:nth-child(2){animation-delay:.1s}.page.on .about-txt>*:nth-child(3){animation-delay:.2s}
.page.on .about-txt>*:nth-child(4){animation-delay:.3s}.page.on .about-txt>*:nth-child(5){animation-delay:.4s}

/* ---------- clients ---------- */
.clients-wrap{width:100%}
.clients-wrap .sec-title{width:min(1100px,100%);margin-inline:auto;padding-inline:clamp(0px,4vw,40px);margin-bottom:clamp(14px,3vh,30px)}
.rows{display:flex;flex-direction:column;gap:14px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.row{overflow:hidden;direction:ltr}
.track{display:flex;gap:14px;width:max-content;animation:run var(--t,42s) linear infinite}
.row:nth-child(2) .track{animation-direction:reverse;--t:50s}
.row:nth-child(3) .track{--t:46s}
@keyframes run{to{transform:translateX(-50%)}}
.logo{flex:none;width:clamp(130px,15vw,172px);height:clamp(84px,10vw,108px);border-radius:18px;
  background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid var(--glass-line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;direction:rtl;color:#e9e4ff;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.logo svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:1.6;stroke-linejoin:round;opacity:.9}
.logo img{max-width:70%;max-height:60%;object-fit:contain}
.logo span{font-size:.8rem;font-weight:700;color:var(--muted)}

/* ---------- stats ---------- */
.stats{display:flex;justify-content:center;gap:clamp(12px,2.4vw,28px);perspective:1100px}
.stat{width:clamp(104px,23vw,250px);aspect-ratio:.64;border-radius:28px;padding:clamp(12px,2vw,26px) 10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.2vh,22px);text-align:center;
  background:linear-gradient(165deg,rgba(139,92,246,.26),rgba(255,255,255,.04) 55%);
  border:1px solid var(--glass-line);box-shadow:0 30px 70px rgba(6,2,28,.55),inset 0 1px 0 rgba(255,255,255,.14);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  transform:rotateY(var(--ry,0deg)) translateY(var(--ty,0px));transition:transform .5s}
.stat:nth-child(1){--ry:-7deg}.stat:nth-child(2){--ty:-14px}.stat:nth-child(3){--ry:7deg}
.stat:hover{transform:rotateY(0) translateY(-10px)}
.ico{width:clamp(48px,7vw,84px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#b79cff,#7c3aed 70%);box-shadow:0 0 34px rgba(139,92,246,.65),inset 0 1px 0 rgba(255,255,255,.4)}
.ico svg{width:46%;height:46%;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.num{direction:ltr;unicode-bidi:isolate;font-family:var(--display);font-weight:900;font-size:clamp(1.5rem,4.6vw,3.7rem);line-height:1;font-variant-numeric:tabular-nums}
.lbl{color:var(--accent-soft);font-weight:700;font-size:clamp(.8rem,1.6vw,1.15rem)}
.page.on .stat{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.page.on .stat:nth-child(2){animation-delay:.12s}.page.on .stat:nth-child(3){animation-delay:.24s}

/* ---------- menu ---------- */
.menu{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  background:rgba(9,6,28,.82);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);
  opacity:0;visibility:hidden;transition:opacity .4s,visibility 0s .4s}
.menu.open{opacity:1;visibility:visible;transition:opacity .4s}
.menu-in{display:flex;flex-direction:column;gap:6px;width:min(420px,100%);text-align:center}
.menu-in button.link{font-family:var(--display);font-weight:900;font-size:clamp(1.8rem,6vw,2.8rem);padding:6px;color:var(--ink);transition:color .25s,transform .25s}
.menu-in button.link:hover{color:var(--accent-soft);transform:scale(1.04)}
.contact{margin-top:22px;padding-top:20px;border-top:1px solid var(--glass-line);display:flex;flex-direction:column;gap:8px;color:var(--muted)}
.contact b{color:var(--ink)}
.contact span,.contact a{user-select:text;-webkit-user-select:text}
.close{position:absolute;top:max(16px,env(safe-area-inset-top,0px));left:16px;width:46px;height:46px;border-radius:50%;
  background:var(--glass);border:1px solid var(--glass-line);display:grid;place-items:center}
.close svg{width:18px;height:18px;stroke:#fff;stroke-width:2.2;stroke-linecap:round}

/* ---------- small screens ---------- */
@media (max-width:760px){
  .top{justify-content:center}
  .burger{display:none}
  .pill{position:fixed;inset:auto 0 max(14px,env(safe-area-inset-bottom,0px));margin-inline:auto;width:max-content;max-width:calc(100% - 24px);z-index:25}
  .pill button{padding:0 11px;font-size:.8rem}
  .page{padding-top:calc(76px + env(safe-area-inset-top,0px));padding-bottom:96px}
  .hero-row{grid-template-columns:1fr 1fr;grid-template-areas:"av av" "who cta"}
  .avatar{grid-area:av;justify-self:center;width:min(30vh,250px)}
  .who{grid-area:who;padding:12px 0 0;justify-self:start}
  .cta{grid-area:cta;margin:12px 0 0}
  .about{grid-template-columns:1fr;text-align:center;justify-items:center}
  .photo{width:min(200px,50vw)}
  .about-txt{display:flex;flex-direction:column;align-items:center}
  .about-txt p{text-align:start}
  .hero{--hfs:min(19vw,12vh)}
  .stage3d{--ch:min(52vh,430px)}
  .float .card{width:calc(var(--ch)*.78);height:calc(var(--ch)*.56)}
  .card{border-radius:18px}
  .stat{border-radius:20px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01s!important}
}

/* Enhanced layered 3D page choreography */
.pages{perspective:1700px;transform-style:preserve-3d}
.page{transform-style:preserve-3d;will-change:transform,opacity,filter}
.page.exit-3d{opacity:0;transform:perspective(1300px) translateX(-35%) translateZ(-440px) rotateY(55deg) rotateX(-8deg) scale(.73)!important;filter:blur(18px)}
.page.on .inner{animation:depth-entry .75s cubic-bezier(.14,.9,.2,1) both}
@keyframes depth-entry{from{opacity:.3;transform:translateZ(-120px) translateY(32px) rotateX(8deg)}to{opacity:1;transform:none}}
.avatar img{object-fit:cover;border-radius:46% 46% 40% 40%;mask-image:linear-gradient(0deg,transparent,#000 18%,#000)}
.photo img{object-fit:cover}
.poster{border:1px solid rgba(255,255,255,.2);transition:box-shadow .4s}
.card:hover .poster{box-shadow:0 20px 65px rgba(153,91,255,.65),inset 0 0 0 1px rgba(255,255,255,.25)}
@media(max-width:760px){.avatar img{max-height:260px}.page.exit-3d{transform:perspective(900px) rotateY(40deg) translateZ(-250px) scale(.77)!important}}
</style>
</head>
<body>

<div class="app" dir="rtl" lang="ar">
  <div class="bg"><svg id="ripples" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg></div>

  <header class="top">
    <button class="brand" id="brand" type="button" aria-label="الرئيسية"><span class="mini" id="miniAvatar"></span><span id="brandName"></span></button>
    <nav class="pill" id="nav" aria-label="التنقل">
      <i class="thumb" id="thumb"></i>
      <button type="button" data-page="home">الرئيسية</button>
      <button type="button" data-page="works">أعمالي</button>
      <button type="button" data-page="about">من أنا</button>
      <button type="button" data-page="clients">تقنياتي</button>
      <button type="button" data-page="stats">إنجازاتي</button>
    </nav>
    <button class="burger" id="burger" type="button" aria-label="القائمة" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </header>

  <main class="pages">
    <section class="page" id="home" aria-label="الرئيسية"><div class="inner hero">
      <h1><span class="l1" id="h1a"></span><span class="l2"><span id="h1b"></span><i>.</i></span></h1>
      <div class="hero-row">
        <div class="who"><b id="heroName"></b><span id="heroRole"></span></div>
        <div class="avatar" id="heroAvatar"></div>
        <button class="cta" type="button" data-page="works">أعمالي <svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      </div>
    </div></section>

    <section class="page" id="works" aria-label="أعمالي"><div class="inner">
      <div class="works-wrap" id="worksWrap">
        <div class="w-head sec-title"><h2>أعمالي</h2><p id="wSub"></p></div>
        <div class="stage3d" id="wStage"></div>
        <div class="dots" id="wDots"></div>
      </div>
    </div></section>

    <section class="page" id="about" aria-label="من أنا"><div class="inner">
      <div class="about">
        <figure class="photo" id="photo" style="margin:0"></figure>
        <div class="about-txt"><small>أنا</small><h2 id="aboutName"></h2><hr><div id="aboutText"></div></div>
      </div>
    </div></section>

    <section class="page" id="clients" aria-label="تقنياتي"><div class="inner clients-wrap">
      <div class="sec-title"><h2>تقنياتي</h2></div>
      <div class="rows" id="rows"></div>
    </div></section>

    <section class="page" id="stats" aria-label="إنجازاتي"><div class="inner"><div class="stats" id="statsRow"></div></div></section>
  </main>

  <div class="menu" id="menu" aria-hidden="true">
    <button class="close" id="close" type="button" aria-label="إغلاق"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    <div class="menu-in" id="menuIn"></div>
  </div>
</div>

<script>
/* =========================================================
   عدّل هذا القسم فقط: اسمك، صورك، أعمالك، عملاءك، أرقامك
   ========================================================= */
const SITE = {
  name: 'علي ياسين',
  role: 'مطور تطبيقات ومواقع وأنظمة رقمية',
  headline: ['من الفكرة', 'إلى التطبيق'],
  avatar: 'https://avatars.githubusercontent.com/u/295392744?v=4',
  photo: 'https://avatars.githubusercontent.com/u/295392744?v=4',
  about: [
    'أنا علي ياسين، أهتم بتصميم وتطوير التطبيقات والمواقع والأنظمة الرقمية، وتحويل الأفكار إلى أدوات وتجارب عملية بواجهات عربية حديثة.',
    'من مشاريعي تطبيق 313، ومتجر Puabi، ومنصة القبس، وNice Chat — نبض، وتطبيق دلّيني للملاحة، وبرنامج جدولي للجداول المدرسية. أواصل تطوير هذه المشاريع وإضافة التحسينات والخصائص الجديدة.',
    'أهتم بتجربة المستخدم والتفاصيل البصرية والأداء، وبالعمل على تطبيقات الهواتف والحاسوب والويب.'
  ],
  works: [
    { title: 'تطبيقات الهواتف والمنصات', mode: 'rail', items: [
      { img: '', c: ['#bc8738','#342105'], t: '313 — التطبيق الديني' },
      { img: '', c: ['#fe6daa','#762051'], t: 'Puabi — متجر التجميل' },
      { img: '', c: ['#1487e8','#18356d'], t: 'القبس — ثقافة وتنمية' },
      { img: '', c: ['#8736ea','#100939'], t: 'Nice Chat — نبض' },
      { img: '', c: ['#22b9aa','#0a4354'], t: 'Daleeni — دلّيني' },
      { img: '', c: ['#2b73e4','#12346f'], t: 'ORVEO — وكلاء الذكاء الاصطناعي' }
    ]},
    { title: 'أنظمة الإدارة والبرمجيات', mode: 'float', items: [
      { img: '', c: ['#225bd4','#0b204e'], t: 'جدولي — الجداول المدرسية' },
      { img: '', c: ['#7c3aed','#1c1151'], t: 'إدارة البيانات والتقارير' },
      { img: '', c: ['#0c94aa','#143963'], t: 'لوحات التحكم والمواقع' },
      { img: '', c: ['#b65ed9','#3b1b68'], t: 'حلول رقمية مخصصة' }
    ]}
  ],
  clients: ['Flutter','Dart','Node.js','iOS','Android','Web','واجهة المستخدم','GitHub','Firebase','HTML / CSS','JavaScript','Windows'],
  stats: [
    { n: 6, label: 'مشاريع بارزة', icon: 'briefcase' },
    { n: 3, label: 'منصات: هاتف / ويب / حاسوب', icon: 'award' },
    { n: 5, label: 'أقسام الموقع', icon: 'users' }
  ],
  contact: [
    { label: 'إنستغرام', text: '@3li_rz', url: 'https://www.instagram.com/3li_rz/' },
    { label: 'GitHub', text: 'github.com/3lirz', url: 'https://github.com/3lirz' }
  ]
};
/* ========================================================= */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const ICON = {
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  briefcase: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
  award: '<circle cx="12" cy="8" r="6"/><path d="M15.5 12.9 17 22l-5-3-5 3 1.5-9.1"/>',
  heart: '<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/>',
  user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'
};
const GLYPH = [
  '<path d="M12 3l9 16H3z"/>', '<rect x="4" y="4" width="16" height="16" rx="3"/>', '<circle cx="12" cy="12" r="8"/>',
  '<path d="M12 2l8.7 5v10L12 22l-8.7-5V7z"/>', '<path d="M4 12h16M12 4v16"/><circle cx="12" cy="12" r="8"/>', '<path d="M12 3l2.6 6.4L21 12l-6.4 2.6L12 21l-2.6-6.4L3 12l6.4-2.6z"/>'
];

/* ---------- avatars (placeholder or real image) ---------- */
function faceSVG() {
  return `<svg viewBox="0 0 220 250" aria-hidden="true">
    <ellipse cx="38" cy="136" rx="12" ry="19" fill="#b9a2ff"/><ellipse cx="182" cy="136" rx="12" ry="19" fill="#b9a2ff"/>
    <ellipse cx="110" cy="134" rx="72" ry="88" fill="#d3c4ff"/>
    <path d="M36 122C28 62 66 30 112 30s82 30 72 92c-12-30-34-46-72-48-38 2-62 16-76 48z" fill="#3a2780"/>
    <circle cx="84" cy="136" r="7" fill="#26195e"/><circle cx="136" cy="136" r="7" fill="#26195e"/>
    <path d="M88 174q22 16 44 0" stroke="#26195e" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M60 232c8-24 28-36 50-36s42 12 50 36z" fill="#8b5cf6"/></svg>`;
}
function bustSVG() {
  return `<svg viewBox="0 0 300 375" aria-hidden="true" preserveAspectRatio="xMidYMax slice">
    <ellipse cx="150" cy="150" rx="62" ry="76" fill="#d3c4ff"/>
    <path d="M86 136c-6-52 26-86 66-86s70 30 62 88c-10-26-30-40-62-42-34 2-52 14-66 40z" fill="#2c1d66"/>
    <path d="M40 375c4-80 46-120 110-120s106 40 110 120z" fill="#1a1245"/>
    <path d="M120 255l30 40 30-40" fill="#d3c4ff"/></svg>`;
}
const imgOr = (src, fallback, alt = '') => src ? `<img src="${esc(src)}" alt="${esc(alt)}">` : fallback;

/* ---------- fill content ---------- */
function fill() {
  document.title = `${SITE.name} | معرض الأعمال`;
  $('#brandName').textContent = SITE.name;
  $('#miniAvatar').innerHTML = imgOr(SITE.avatar, faceSVG());
  $('#h1a').textContent = SITE.headline[0];
  $('#h1b').textContent = SITE.headline[1];
  $('#heroName').textContent = SITE.name;
  $('#heroRole').textContent = SITE.role;
  $('#heroAvatar').innerHTML = imgOr(SITE.avatar, faceSVG(), SITE.name);
  $('#photo').innerHTML = imgOr(SITE.photo, bustSVG(), SITE.name);
  $('#aboutName').textContent = SITE.name;
  $('#aboutText').innerHTML = SITE.about.map(p => `<p>${esc(p)}</p>`).join('');

  $('#rows').innerHTML = [0, 1, 2].map(r => {
    const list = SITE.clients.map((c, i) => ({ c: typeof c === 'string' ? { name: c } : c, i }))
      .filter((_, i) => i % 3 === r || SITE.clients.length < 6);
    const cell = ({ c, i }) => `<div class="logo">${c.img ? `<img src="${esc(c.img)}" alt="${esc(c.name)}">`
      : `<svg viewBox="0 0 24 24" aria-hidden="true">${GLYPH[i % GLYPH.length]}</svg>`}<span>${esc(c.name)}</span></div>`;
    const once = list.map(cell).join('');
    return `<div class="row"><div class="track">${once}${once}${once}${once}</div></div>`;
  }).join('');

  $('#statsRow').innerHTML = SITE.stats.map(s => `
    <div class="stat"><div class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[s.icon] || ICON.award}</svg></div>
    <div class="num" data-n="${s.n}">+0</div><div class="lbl">${esc(s.label)}</div></div>`).join('');

  $('#menuIn').innerHTML =
    ['home:الرئيسية', 'works:أعمالي', 'about:من أنا', 'clients:تقنياتي', 'stats:إنجازاتي']
      .map(x => { const [k, v] = x.split(':'); return `<button class="link" type="button" data-page="${k}">${v}</button>`; }).join('') +
    `<div class="contact">${SITE.contact.map(c => `<div><b>${esc(c.label)}:</b> ${c.url
      ? `<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.text)}</a>` : `<span>${esc(c.text)}</span>`}</div>`).join('')}</div>`;
}

/* ---------- ripple background ---------- */
function ripples() {
  const pts = [[110,150],[430,560],[830,90],[1190,400],[1500,150],[260,820],[980,790],[1470,720],[650,340]];
  $('#ripples').innerHTML = pts.map(([x, y], k) =>
    Array.from({ length: 7 }, (_, i) =>
      `<circle cx="${x}" cy="${y}" r="${18 + i * (22 + k % 3 * 4)}" fill="none" stroke="#b9a2ff" stroke-opacity="${(0.1 - i * 0.012).toFixed(3)}" stroke-width="2"/>`).join('')).join('');
}

/* ---------- navigation ---------- */
const PAGES = ['home', 'works', 'about', 'clients', 'stats'];
let current = 'home';
function moveThumb() {
  const b = $(`#nav button[data-page="${current}"]`), nav = $('#nav');
  if (!b) return;
  const t = $('#thumb');
  t.style.width = b.offsetWidth + 'px';
  t.style.left = b.offsetLeft + 'px';
}
function go(name, silent) {
  if (!PAGES.includes(name)) name = 'home';
  const prev = current; current = name;
  if(prev!==name){ const from=$('#'+prev); if(from){from.classList.add('exit-3d');setTimeout(()=>from.classList.remove('exit-3d'),950);} }
  $$('.page').forEach(p => p.classList.toggle('on', p.id === name));
  $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.page === name));
  moveThumb(); closeMenu();
  if (!silent) { try { history.replaceState(null, '', '#' + name); } catch (e) {} }
  if (name === 'works') startAuto(); else stopAuto();
  if (name === 'stats') countUp(); else if (prev === 'stats') $$('.num').forEach(n => n.textContent = '+0');
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-page]');
  if (b) go(b.dataset.page);
});
$('#brand').addEventListener('click', () => go('home'));
addEventListener('hashchange', () => go(location.hash.slice(1), true));

function openMenu() { $('#menu').classList.add('open'); $('#menu').setAttribute('aria-hidden', 'false'); $('#burger').setAttribute('aria-expanded', 'true'); }
function closeMenu() { $('#menu').classList.remove('open'); $('#menu').setAttribute('aria-hidden', 'true'); $('#burger').setAttribute('aria-expanded', 'false'); }
$('#burger').addEventListener('click', openMenu);
$('#close').addEventListener('click', closeMenu);
addEventListener('keydown', e => {
  if (e.key === 'Escape') closeMenu();
  if (current === 'works') { if (e.key === 'ArrowLeft') step(1); if (e.key === 'ArrowRight') step(-1); }
});

/* ---------- stats count-up ---------- */
let countRaf;
function countUp() {
  cancelAnimationFrame(countRaf);
  const nums = $$('.num'); const t0 = performance.now(), D = reduce ? 1 : 1700;
  const tick = now => {
    const p = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - p, 3);
    nums.forEach(n => n.textContent = '+' + Math.round(+n.dataset.n * e));
    if (p < 1) countRaf = requestAnimationFrame(tick);
  };
  countRaf = requestAnimationFrame(tick);
}

/* ---------- works carousel ---------- */
const wStage = $('#wStage'), wDots = $('#wDots'), wSub = $('#wSub'), wWrap = $('#worksWrap');
let cat = 0, idx = 0, auto = null, hover = false;

const posterHTML = (it, i) => `<div class="poster" style="--c1:${it.c[0]};--c2:${it.c[1]}">${it.img ? `<img src="${esc(it.img)}" alt="">` :
  `<span class="tag">مكان تصميمك</span><span class="ring"></span><div><h3>${esc(it.t || 'عنوان التصميم')}</h3><small>استبدل هذا الكرت بصورة عملك</small></div>`}</div>`;
const bookHTML = (it, i) => it.img ? `<div class="book"><img src="${esc(it.img)}" alt=""></div>` :
  `<div class="book" style="--c1:${it.c[0]};--c2:${it.c[1]}"><div class="pg l"><div class="blk"></div><i></i><i></i><i></i></div><div class="pg r"><i></i><i></i><i></i><i></i><i></i><div class="blk"></div></div></div>`;

function renderCat() {
  const c = SITE.works[cat];
  wSub.textContent = c.title;
  wStage.className = 'stage3d ' + c.mode;
  wStage.innerHTML = c.items.map((it, i) =>
    `<button class="card" type="button" aria-label="عمل ${i + 1}">${c.mode === 'float' ? bookHTML(it, i) : posterHTML(it, i)}</button>`).join('') +
    (c.mode === 'float' ? `<div class="badges" id="badges">
      <span class="badge" style="left:calc(50% - 250px);top:26%">${svgI('heart')}</span>
      <span class="badge" style="left:calc(50% + 190px);top:18%;animation-delay:-1s">${svgI('user')}</span>
      <span class="badge" style="left:calc(50% + 60px);top:74%;animation-delay:-2s">${svgI('heart')}</span>
      <span class="badge" style="left:calc(50% - 170px);top:76%;animation-delay:-.5s">${svgI('user')}</span></div>` : '');
  $$('.card', wStage).forEach((el, i) => el.addEventListener('click', () => { idx = i; place(); restartAuto(); }));
  wDots.innerHTML = c.items.map(() => '<i></i>').join('');
  place();
}
const svgI = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;

function place() {
  const c = SITE.works[cat], cards = $$('.card', wStage);
  const w = cards[0] ? cards[0].offsetWidth : 260;
  cards.forEach((el, i) => {
    const o = i - idx, a = Math.abs(o);
    let t, op, f;
    if (c.mode === 'float') {
      t = `translate(-50%,-50%) translateX(${-o * w * 0.82}px) translateY(${a * 34}px) rotateX(42deg) rotateZ(${-9 - o * 4}deg) rotateY(${-o * 14}deg) scale(${Math.max(.5, 1 - a * .16)})`;
      op = a > 2 ? 0 : 1 - a * .3; f = o ? 'brightness(.7)' : 'none';
    } else {
      t = `translate(-50%,-50%) translateX(${-o * w * 1.08}px) scale(${o ? Math.max(.7, .9 - (a - 1) * .08) : 1})`;
      op = a > 3 ? 0 : 1 - Math.max(0, a - 1) * .18; f = o ? 'brightness(.78)' : 'none';
    }
    el.style.transform = t; el.style.opacity = op; el.style.filter = f;
    el.style.zIndex = 20 - a; el.style.pointerEvents = op ? 'auto' : 'none';
    el.tabIndex = op ? 0 : -1;
  });
  const b = $('#badges'); if (b) b.style.opacity = 1;
  $$('i', wDots).forEach((d, i) => d.classList.toggle('on', i === idx));
}
function switchCat(d, toLast) {
  wWrap.classList.add('swap');
  setTimeout(() => {
    cat = (cat + d + SITE.works.length) % SITE.works.length;
    idx = toLast ? SITE.works[cat].items.length - 1 : 0;
    renderCat();
    requestAnimationFrame(() => wWrap.classList.remove('swap'));
  }, 480);
}
let swapping = false;
function step(d) {
  if (swapping) return;
  const n = SITE.works[cat].items.length, j = idx + d;
  if (j >= n || j < 0) {
    if (SITE.works.length < 2) { idx = (j + n) % n; place(); return; }
    swapping = true; switchCat(d, d < 0); setTimeout(() => swapping = false, 1100); return;
  }
  idx = j; place();
}
function startAuto() { stopAuto(); if (reduce) return; auto = setInterval(() => { if (!hover) step(1); }, 3200); }
function stopAuto() { clearInterval(auto); auto = null; }
function restartAuto() { if (current === 'works') startAuto(); }

wStage.addEventListener('pointerenter', () => hover = true);
wStage.addEventListener('pointerleave', () => hover = false);
let sx = null;
wStage.addEventListener('pointerdown', e => { sx = e.clientX; });
addEventListener('pointerup', e => {
  if (sx === null) return; const dx = e.clientX - sx; sx = null;
  if (Math.abs(dx) > 45) { step(dx < 0 ? 1 : -1); restartAuto(); }
});
let wl = false;
wStage.addEventListener('wheel', e => {
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : 0;
  if (Math.abs(d) > 24 && !wl) { wl = true; step(d > 0 ? -1 : 1); restartAuto(); setTimeout(() => wl = false, 450); }
}, { passive: true });
addEventListener('resize', () => { place(); moveThumb(); });

/* ---------- boot ---------- */
fill(); ripples(); renderCat();
document.fonts && document.fonts.ready.then(moveThumb);
new ResizeObserver(moveThumb).observe($('#nav'));
go(location.hash.slice(1) || 'home', true);
</script>
</body>
</html>
