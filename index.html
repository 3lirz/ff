<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>VEXA Cloud Console</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="toast" class="toast" hidden></div>

  <section id="authView" class="auth-shell">
    <div class="auth-orb orb-a"></div><div class="auth-orb orb-b"></div>
    <div class="brand-lockup">
      <div class="logo">V</div>
      <div><strong>VEXA CLOUD</strong><span>Developer Platform</span></div>
    </div>
    <div class="auth-card glass">
      <div class="eyebrow">CONTROL PLANE</div>
      <h1 id="authTitle">تسجيل الدخول</h1>
      <p id="authSubtitle">ادخل إلى لوحة إدارة VEXA Core.</p>
      <form id="loginForm" class="stack">
        <label>البريد الإلكتروني<input id="loginEmail" type="email" autocomplete="username" required placeholder="owner@vexa-cloud.com" /></label>
        <label>كلمة المرور<input id="loginPassword" type="password" autocomplete="current-password" required minlength="10" /></label>
        <button class="btn primary" type="submit">دخول إلى VEXA</button>
      </form>
      <form id="bootstrapForm" class="stack" hidden>
        <label>الاسم<input id="bootstrapName" required minlength="2" placeholder="Ali" /></label>
        <label>البريد الإلكتروني<input id="bootstrapEmail" type="email" autocomplete="username" required /></label>
        <label>كلمة المرور<input id="bootstrapPassword" type="password" autocomplete="new-password" required minlength="10" /></label>
        <label>Bootstrap Token<input id="bootstrapToken" type="password" required /></label>
        <button class="btn primary" type="submit">إنشاء حساب المالك</button>
      </form>
      <button id="switchAuth" class="link-btn" type="button" hidden>تهيئة المالك لأول مرة</button>
    </div>
  </section>

  <section id="appView" class="app-shell" hidden>
    <aside class="sidebar">
      <div class="side-brand"><div class="logo small">V</div><div><strong>VEXA</strong><span>Cloud Console</span></div></div>
      <nav id="nav">
        <button data-view="overview" class="nav-item active"><span>◫</span> نظرة عامة</button>
        <button data-view="projects" class="nav-item"><span>◇</span> المشاريع</button>
        <button data-view="users" class="nav-item"><span>◎</span> المستخدمون</button>
        <button data-view="regions" class="nav-item"><span>⌁</span> المناطق</button>
      </nav>
      <div class="side-footer">
        <div id="whoami" class="user-chip"></div>
        <button id="logoutBtn" class="btn ghost full">تسجيل الخروج</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div><div class="eyebrow">VEXA CORE v0.8.0</div><h2 id="pageTitle">نظرة عامة</h2></div>
        <div class="status-pill"><i></i><span>Control Plane</span></div>
      </header>
      <div id="content" class="content"></div>
    </main>
  </section>

  <dialog id="modal" class="modal"><div id="modalBody"></div></dialog>
  <script src="./loader.js" defer></script>
</body>
</html>
