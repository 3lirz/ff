<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0c0d"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://tydfhtwqvvdrisurxibw.supabase.co; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; frame-ancestors 'none'"><title>VEXA Cloud</title><style>:root{--b:#0b0c0d;--p:#111315;--p2:#17191c;--l:#2b2e32;--t:#eef1f3;--m:#8a9199;--g:#3ecf8e;--a:#d6a449}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:Inter,"Noto Sans Arabic",Tahoma,Arial,sans-serif}button,input,select{font:inherit}.hide{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 18%,#3ecf8e12,transparent 31%),var(--b)}.box{width:min(430px,100%);background:var(--p);border:1px solid var(--l);border-radius:15px;padding:28px;box-shadow:0 28px 80px #0008}.brand{display:flex;gap:10px;align-items:center;margin-bottom:26px}.logo{width:40px;height:40px;border-radius:10px;background:var(--g);color:#04170e;display:grid;place-items:center;font-size:21px;font-weight:950}.brand b,.brand small{display:block}.brand small,.muted{color:var(--m)}h1{font-size:25px;margin:0 0 7px}.field{display:grid;gap:6px;margin:14px 0;font-size:12px;color:#c7ccd1}input,select{width:100%;padding:11px 12px;border-radius:8px;border:1px solid #30343a;background:#0d0f10;color:var(--t);outline:0}input:focus,select:focus{border-color:#4d6b5e;box-shadow:0 0 0 3px #3ecf8e12}.btn{border:1px solid var(--l);background:#1a1d20;color:var(--t);border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer}.btn:hover{background:#222529}.btn.primary{background:var(--g);border-color:var(--g);color:#04170e}.btn.danger{color:#f1a2a2;border-color:#613333;background:#241313}.full{width:100%}.notice{margin-top:16px;padding:10px;border:1px solid #315a47;background:#101d17;color:#9bd7b8;border-radius:8px;font-size:11px;line-height:1.7}.err{color:#f0a0a0;font-size:12px;margin-top:12px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--g);margin-left:5px}.dot.amber{background:var(--a)}.shell{min-height:100vh;display:grid;grid-template-columns:236px 1fr;direction:ltr}.side{height:100vh;position:sticky;top:0;background:#0f1012;border-right:1px solid var(--l);padding:14px 10px;display:flex;flex-direction:column;direction:rtl}.sidebrand{display:flex;gap:9px;align-items:center;padding:3px 6px 14px;border-bottom:1px solid #202328}.sidebrand .logo{width:32px;height:32px;font-size:17px}.navlabel{font-size:9px;color:#656b72;margin:16px 8px 7px}.nav{display:grid;gap:2px}.nav button{border:0;background:transparent;color:#9299a1;text-align:right;padding:10px;border-radius:7px;cursor:pointer}.nav button:hover,.nav button.active{background:#1a1d20;color:#f1f3f4}.nav button.active{box-shadow:inset -2px 0 var(--g)}.space{flex:1}.status{border-top:1px solid #202328;padding:12px 8px;color:var(--m);font-size:10px;line-height:2}.main{direction:rtl;min-width:0}.top{height:58px;border-bottom:1px solid var(--l);background:#0f1012f5;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:5}.who{font-size:11px;color:var(--m);direction:ltr}.content{max-width:1450px;margin:auto;padding:22px 20px 50px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}.head h2{font-size:20px;margin:0 0 5px}.head p{font-size:11px;color:var(--m);margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:var(--p);border:1px solid var(--l);border-radius:9px;padding:14px}.stat small{font-size:10px;color:var(--m)}.stat strong{display:block;font-size:23px;margin:7px 0}.badge{display:inline-flex;padding:3px 7px;border:1px solid #34383d;border-radius:5px;background:#17191c;color:#b8bec5;font-size:9px}.badge.active{border-color:#2e6a4c;color:#84deb0;background:#102219}.badge.planned{border-color:#604a21;color:#dfb975;background:#241c0f}.section{margin-top:18px}.kv{display:grid;grid-template-columns:150px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid #24272b;font-size:11px}.kv:last-child{border:0}.projects{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.project{cursor:pointer}.project:hover{border-color:#3b444b;background:#14171a}.project h3{margin:0 0 6px}.slug{font:9px ui-monospace,monospace;color:#69717a;direction:ltr;text-align:left;margin:10px 0}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.formrow{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px}.tablewrap{overflow:auto;border:1px solid var(--l);border-radius:9px}table{width:100%;border-collapse:collapse;min-width:650px;background:var(--p)}th,td{padding:10px;border-bottom:1px solid #24272b;text-align:right;font-size:11px}th{background:#141619;color:#7f868e}.ltr{direction:ltr;text-align:left}.toast{position:fixed;left:20px;top:75px;background:#17191c;border:1px solid #34383d;padding:10px 12px;border-radius:8px;font-size:11px;z-index:99}.toast.bad{border-color:#633636;color:#f0a0a0}@media(max-width:1000px){.stats,.projects{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.shell{grid-template-columns:1fr}.side{height:auto;position:static;border-right:0;border-bottom:1px solid var(--l)}.nav{grid-template-columns:repeat(4,1fr)}.navlabel,.space,.status{display:none}.top{position:static}.content{padding:16px 12px}.stats,.projects,.formrow{grid-template-columns:1fr}}</style></head><body><div id="toast" class="toast hide"></div><section id="login" class="login"><div class="box"><div class="brand"><div class="logo">V</div><div><b>VEXA</b><small>Cloud Console</small></div></div><h1>تسجيل الدخول</h1><p class="muted">VEXA Control Plane — Production Edge.</p><form id="lf"><label class="field">البريد الإلكتروني<input id="em" type="email" autocomplete="username" required></label><label class="field">كلمة المرور<input id="pw" type="password" autocomplete="current-password" required></label><button class="btn primary full">دخول إلى VEXA</button></form><div id="le" class="err hide"></div><div class="notice"><span class="dot"></span> HTTPS + Edge API + PostgreSQL Online<br><span class="dot amber"></span> Contabo VPS services reconnecting</div></div></section><section id="app" class="shell hide"><aside class="side"><div class="sidebrand"><div class="logo">V</div><div><b>VEXA</b><small class="muted">Cloud</small></div></div><div class="navlabel">المنصة</div><nav class="nav"><button data-v="overview" class="active">نظرة عامة</button><button data-v="projects">المشاريع</button><button data-v="regions">المناطق</button><button data-v="account">الحساب</button></nav><div class="space"></div><div class="status"><div><span class="dot"></span>Edge API Online</div><div><span class="dot"></span>PostgreSQL Online</div><div><span class="dot amber"></span>VPS Reconnecting</div></div></aside><main class="main"><header class="top"><b id="title">نظرة عامة</b><div id="who" class="who"></div></header><div id="content" class="content"></div></main></section><script>const BASE='https://tydfhtwqvvdrisurxibw.supabase.co/functions/v1/vexa-api',S={t:sessionStorage.getItem('vexa_session')||'',u:null,o:null,p:[],r:[]},q=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(m,b=0){let e=q('#toast');e.textContent=m;e.className='toast'+(b?' bad':'');setTimeout(()=>e.className='toast hide',3000)}async function api(p,o={}){let h={'content-type':'application/json',...(o.headers||{})};if(S.t)h.authorization='Bearer '+S.t;let r=await fetch(BASE+p,{...o,headers:h}),x=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401&&S.t)logout(0);throw Error(x?.error?.message||'HTTP '+r.status)}return x}function badge(x){return '<span class="badge '+esc(x)+'">'+esc(x)+'</span>'}function head(t,d,a=''){return '<div class="head"><div><h2>'+t+'</h2><p>'+d+'</p></div>'+a+'</div>'}function show(){q('#login').classList.add('hide');q('#app').classList.remove('hide');q('#who').textContent=S.u.email+' · '+S.u.platformRole}function logout(call=1){if(call&&S.t)api('/v1/admin/logout',{method:'POST'}).catch(()=>{});S.t='';S.u=null;sessionStorage.removeItem('vexa_session');q('#app').classList.add('hide');q('#login').classList.remove('hide')}async function load(){let[o,p,r]=await Promise.all([api('/v1/admin/overview'),api('/v1/projects'),api('/v1/regions')]);S.o=o;S.p=p.projects;S.r=r.regions}function overview(){let o=S.o;return head('نظرة عامة','حالة VEXA Cloud الآن')+'<div class="stats"><div class="card stat"><small>المشاريع</small><strong>'+o.projects.total+'</strong>'+badge(o.projects.active+' active')+'</div><div class="card stat"><small>المستخدمون</small><strong>'+o.users.total+'</strong>'+badge(o.users.active+' active')+'</div><div class="card stat"><small>API Keys</small><strong>'+o.apiKeys.active+'</strong>'+badge('active')+'</div><div class="card stat"><small>Regions</small><strong>'+o.regions.active+'</strong>'+badge(o.regions.planned+' planned')+'</div></div><div class="card section"><h3>Production status</h3><div class="kv"><span>Public frontend</span><b>Online</b></div><div class="kv"><span>Edge API</span><b>Online</b></div><div class="kv"><span>Database</span><b>PostgreSQL · Online</b></div><div class="kv"><span>Contabo VPS</span><b style="color:#dfb975">Reconnecting</b></div></div>'}function projects(){let opts=S.r.filter(x=>x.selectable).map(x=>'<option value="'+x.code+'">'+esc(x.name)+'</option>').join(''),cards=S.p.map(p=>'<div class="card project" onclick="project(\''+p.id+'\')"><div class="row"><h3>'+esc(p.name)+'</h3>'+badge(p.status)+'</div><div class="slug">'+esc(p.slug)+'</div><div class="row">'+badge(p.environment)+badge(p.regionName)+badge(p.plan)+'</div></div>').join('');return head('المشاريع','إدارة مشاريع VEXA')+'<form id="np" class="formrow card"><input id="pn" placeholder="اسم المشروع" required><select id="pr">'+opts+'</select><select id="pe"><option value="production">Production</option><option value="staging">Staging</option><option value="development">Development</option></select><button class="btn primary">إنشاء</button></form><div class="section projects">'+cards+'</div>'}function regions(){return head('المناطق','مواقع البنية التحتية')+'<div class="tablewrap"><table><thead><tr><th>Region</th><th>الاسم</th><th>المدينة</th><th>الحالة</th><th>متاح</th></tr></thead><tbody>'+S.r.map(r=>'<tr><td class="ltr">'+esc(r.code)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.city)+'</td><td>'+badge(r.status)+'</td><td>'+(r.selectable?'نعم':'قريباً')+'</td></tr>').join('')+'</tbody></table></div>'}function account(){return head('الحساب','حساب المالك والأمان','<button class="btn danger" onclick="logout()">تسجيل الخروج</button>')+'<div class="card"><div class="kv"><span>الاسم</span><b>'+esc(S.u.name)+'</b></div><div class="kv"><span>البريد</span><b class="ltr">'+esc(S.u.email)+'</b></div><div class="kv"><span>الدور</span><b>'+esc(S.u.platformRole)+'</b></div></div><form id="cp" class="card section"><h3>تغيير كلمة المرور</h3><label class="field">الحالية<input id="op" type="password" required></label><label class="field">الجديدة — 12 حرف أو أكثر<input id="xp" type="password" minlength="12" required></label><button class="btn primary">تغيير</button></form>'}function render(v){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));q('#title').textContent={overview:'نظرة عامة',projects:'المشاريع',regions:'المناطق',account:'الحساب'}[v];q('#content').innerHTML={overview:overview,projects:projects,regions:regions,account:account}[v]();if(v==='projects')q('#np').onsubmit=async e=>{e.preventDefault();try{let x=await api('/v1/projects',{method:'POST',body:JSON.stringify({name:q('#pn').value,region:q('#pr').value,environment:q('#pe').value})});await load();render('projects');toast('تم إنشاء المشروع');if(x.keys?.[1]?.value)alert('Server key — يظهر مرة واحدة فقط:\n\n'+x.keys[1].value)}catch(e){toast(e.message,1)}};if(v==='account')q('#cp').onsubmit=async e=>{e.preventDefault();try{await api('/v1/admin/change-password',{method:'POST',body:JSON.stringify({currentPassword:q('#op').value,newPassword:q('#xp').value})});toast('تم التغيير. سجل الدخول من جديد.');setTimeout(()=>logout(0),900)}catch(e){toast(e.message,1)}}}async function project(id){try{let[p,k]=await Promise.all([api('/v1/projects/'+id),api('/v1/projects/'+id+'/keys')]),z=p.project;q('#title').textContent=z.name;q('#content').innerHTML=head(esc(z.name),'Project ID: '+esc(z.id),'<button class="btn" onclick="render(\'projects\')">رجوع</button>')+'<div class="card"><div class="kv"><span>Slug</span><b class="ltr">'+esc(z.slug)+'</b></div><div class="kv"><span>Region</span><b>'+esc(z.regionName)+'</b></div><div class="kv"><span>Environment</span><b>'+esc(z.environment)+'</b></div><div class="kv"><span>Status</span><b>'+esc(z.status)+'</b></div></div><div class="card section"><div class="head"><div><h3>API Keys</h3><p>Secret key يظهر مرة واحدة فقط.</p></div><div class="row"><button id="pk" class="btn">Public key</button><button id="sk" class="btn primary">Server key</button></div></div>'+(k.keys.length?k.keys.map(x=>'<div class="kv"><span>'+esc(x.name)+'</span><div>'+badge(x.type)+' <code>'+esc(x.prefix)+'…</code></div></div>').join(''):'<p class="muted">لا توجد مفاتيح.</p>')+'</div>';let mk=async type=>{try{let x=await api('/v1/projects/'+id+'/keys',{method:'POST',body:JSON.stringify({type,name:type==='public'?'Public client key':'Server key'})});alert((type==='secret'?'احفظ المفتاح الآن — لن يظهر مرة ثانية:':'Public key:')+'\n\n'+x.key.value);project(id)}catch(e){toast(e.message,1)}};q('#pk').onclick=()=>mk('public');q('#sk').onclick=()=>mk('secret')}catch(e){toast(e.message,1)}}window.project=project;window.render=render;window.logout=logout;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>render(b.dataset.v));q('#lf').onsubmit=async e=>{e.preventDefault();q('#le').classList.add('hide');try{let x=await api('/v1/admin/login',{method:'POST',body:JSON.stringify({email:q('#em').value,password:q('#pw').value})});S.t=x.token;S.u=x.user;sessionStorage.setItem('vexa_session',S.t);await load();show();render('overview')}catch(e){q('#le').textContent=e.message;q('#le').classList.remove('hide')}};(async()=>{if(!S.t)return;try{S.u=(await api('/v1/admin/me')).user;await load();show();render('overview')}catch{logout(0)}})();</script></body></html>
